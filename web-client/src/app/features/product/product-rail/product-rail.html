<section class="catalog-section" [id]="sectionId()">
  <div class="catalog-section__header">
    <h2>{{ title() }}</h2>
    <a [href]="link()" class="catalog-section__link">Ver todo</a>
  </div>

  <div class="product-rail">
    <button
      type="button"
      class="product-rail__nav product-rail__nav--prev"
      (click)="scrollByAmount(track, -1)"
      aria-label="Ver libros anteriores"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icon">
        <path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <ul class="product-rail__track" #track>
      @for (product of products(); track product.id) {
        <li class="product-rail__item">
          <app-product-card
            [product]="product"
            [wishlisted]="wishlistedIds().has(product.id)"
            (addToCart)="addToCart.emit($event)"
            (toggleWishlist)="toggleWishlist.emit($event)"
          />
        </li>
      }
    </ul>

    <button
      type="button"
      class="product-rail__nav product-rail__nav--next"
      (click)="scrollByAmount(track, 1)"
      aria-label="Ver más libros"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icon">
        <path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>
