<a class="skip-link" href="#main-content">Jump to the main content</a>

<app-header
  [deliveryLocation]="deliveryLocation()"
  [cartCount]="cartCount()"
  [navLinks]="navLinks"
  (search)="onSearch($event)"
></app-header>

<main id="main-content" class="catalog-layout">
  <app-sidebar
    [categories]="categories"
    [activeCategory]="activeCategory()"
    (categorySelected)="selectCategory($event)"
  />

  <div class="catalog-content">
    <app-promo-carousel [banners]="promoBanners" />

    @for (section of sections; track section.id) {
      <app-product-rail
        [sectionId]="section.id"
        [title]="section.title"
        [link]="section.link"
        [products]="section.products"
        [wishlistedIds]="wishlist()"
        (addToCart)="addToCart($event)"
        (toggleWishlist)="toggleWishlist($event)"
      />
    }
  </div>
</main>

<app-footer (subscribe)="onNewsletterSubscribe($event)" />
